---
# Production environment override configured for Traefik routing
services:
  php:
    image: ${IMAGES_PREFIX:-}focusboard-api-prod
    container_name: "focusboard-php"
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      # 3. Keep the Traefik host routing fix
      SERVER_NAME: ":80"
      CORS_ALLOW_ORIGIN: "^https?://(focusboard\\.92\\.5\\.38\\.37\\.nip\\.io)$"
    ports: !reset []

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.focusboard-api.rule=Host(`api.92.5.38.37.nip.io`)"
      - "traefik.http.routers.focusboard-api.entrypoints=web"
      - "traefik.http.services.focusboard-api.loadbalancer.server.port=80"
      - "traefik.docker.network=web_proxy"

    networks:
      - web_proxy
      - default

  database:
    container_name: "focusboard-database"
    ports: !reset []

  adminer:
    image: adminer:standalone
    container_name: "focusboard_adminer"
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.focusboard-db.rule=Host(`focusboard-db.92.5.38.37.nip.io`)"
      - "traefik.http.routers.focusboard-db.entrypoints=web"
      - "traefik.http.services.focusboard-db.loadbalancer.server.port=8080"
      - "traefik.docker.network=web_proxy"
    networks:
      - web_proxy
      - default

networks:
  web_proxy:
    external: true
