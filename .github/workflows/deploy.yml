name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            echo "[INFO] Starting deployment process for branch: ${{ github.ref_name }}..."
            
            # Navigate to the main project directory
            cd /home/ubuntu/apps/focusboard
            
            # Fetch all branches and switch to the target branch
            echo "[INFO] Fetching and switching to branch: ${{ github.ref_name }}..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Deploy API and Database Tools
            echo "[INFO] Rebuilding and starting Backend services..."
            cd focusboard-api
            docker compose -f compose.yaml -f compose.prod.yaml up -d --build
            
            # Deploy Frontend
            echo "[INFO] Rebuilding and starting Frontend services..."
            cd ../focusboard-front
            docker compose up -d --build
            
            echo "[SUCCESS] Deployment completed successfully!"